<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Archives · PDM</title>
<meta name="theme-color" content="#0C1126">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PDM">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preload" href="assets/fonts/dela-gothic-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/zen-kaku-gothic-new-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/style.css?v=6">
</head>
<body>
<main>
  <div class="page-head"><div><h1>Archives</h1>
  <p class="lede">Tes anciens programmes avec tout l'historique de charges. Pratique pour voir d'où tu pars et comparer avec l'actuel.</p></div><span class="kanji-tag" aria-hidden="true">記録</span></div>
  <div id="list"></div>
</main>
<script src="assets/app.js?v=6"></script>
<script src="assets/fx.js?v=6"></script>
<script>
(async function(){
  const P = window.PDM, { $, esc } = P;
  await P.load();
  const old = P.data.programs.filter(p => !p.current);
  if(!old.length){ $("#list").innerHTML = `<p class="empty">Aucun programme archivé. Quand tu changeras de programme, l'actuel atterrira ici depuis Réglages.</p>`; return; }
  $("#list").innerHTML = old.map((p,i) => `<section class="section" aria-labelledby="ar${i}"><h2 id="ar${i}">${esc(p.title)}</h2><p class="muted" style="margin:-8px 0 16px">${esc(p.subtitle||"")}</p><div data-prog="${esc(p.id)}"></div></section>`).join("");
  old.forEach(p => P.renderProgram($(`[data-prog="${p.id}"]`), p, { session: null, gym: "all" }));
})();
</script>
</body>
</html>
