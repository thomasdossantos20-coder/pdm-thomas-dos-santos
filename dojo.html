<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dojo · PDM</title>
<meta name="theme-color" content="#0C1126">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PDM">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preload" href="assets/fonts/dela-gothic-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/zen-kaku-gothic-new-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/style.css?v=8">
</head>
<body>
<main>
  <div class="page-head"><div><h1>Dojo</h1>
    <p class="lede">Quatre défis pour décompresser entre deux séries, puis le circuit abdos, tes recettes et tes repères du jour.</p></div>
    <span class="kanji-tag" aria-hidden="true">道場</span></div>

  <section aria-labelledby="h-game">
    <h2 id="h-game">Salle des défis</h2>
    <div class="hub" id="hub"></div>
    <div class="game" id="stage"></div>
    <div class="panel tight" style="margin-top:16px">
      <h3 style="margin-bottom:10px" id="best-title">Tes meilleurs scores</h3>
      <ol class="best-list" id="best"></ol>
    </div>
  </section>

  <section class="panel section" aria-labelledby="h-nut">
    <h2 id="h-nut">Repères du jour</h2>
    <div class="stats" id="nut" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))"></div>
  </section>

  <div class="grid grid-2 section">
    <section class="panel" aria-labelledby="h-abs">
      <h2 id="h-abs">Circuit abdos</h2>
      <p class="muted" id="abs-meta" style="margin-top:-6px"></p>
      <div class="moves" id="moves"></div>
      <p class="muted" style="font-size:14px;margin-bottom:0" id="abs-goals"></p>
    </section>
    <section aria-labelledby="h-rec">
      <h2 id="h-rec">Recettes</h2>
      <div class="grid" id="recipes"></div>
    </section>
  </div>
</main>
<script src="assets/app.js?v=8"></script>
<script src="assets/fx.js?v=8"></script>
<script src="assets/games.js?v=8"></script>
<script>
(async function(){
  const P = window.PDM, { $, esc, fmtDate, todayISO } = P;
  await P.load(); const D = P.data;

  /* scores : un tableau par jeu, l'ancien défi shuriken est repris */
  D.games = D.games || {};
  if(D.game && D.game.scores && !D.games.shuriken){ D.games.shuriken = { scores: D.game.scores }; delete D.game; }
  const scoresOf = id => (D.games[id] && D.games[id].scores) || [];
  let cur = null;
  function drawBest(g){
    cur = g; const sc = scoresOf(g.id);
    $("#best-title").textContent = `Tes meilleurs scores · ${g.name}`;
    $("#best").innerHTML = sc.length
      ? sc.map((s,i) => `<li><span>${i === 0 ? "Record" : (i+1) + "e"} · ${fmtDate(s.date)}</span><b>${esc(g.fmt(s.s))}</b></li>`).join("")
      : `<li class="muted" style="justify-content:center">Aucune partie pour l'instant. À toi de poser le premier score.</li>`;
  }
  window.DojoGames($("#hub"), $("#stage"), {
    best: id => scoresOf(id)[0] ? scoresOf(id)[0].s : null,
    onSelect: drawBest,
    onEnd(g, score){
      const prev = scoresOf(g.id), prevBest = prev.length ? prev[0].s : null;
      const better = (a, b) => g.lowerBetter ? a < b : a > b;
      const isBest = (g.lowerBetter || score > 0) && (prevBest == null || better(score, prevBest));
      if(g.lowerBetter || score > 0){
        const entry = { s: score, date: todayISO() }, list = [...prev, entry].sort((a,b) => g.lowerBetter ? a.s - b.s : b.s - a.s).slice(0,5);
        D.games[g.id] = { scores: list };
        if(list.includes(entry)) P.save(isBest ? `Nouveau record · ${g.name}` : null);
      }
      return { best: isBest, bestScore: isBest ? score : (prevBest ?? score) };
    }
  });

  $("#nut").innerHTML = [[D.nutrition.kcal,"calories"],[D.nutrition.protein,"protéines"]].map(([v,l]) => `<div class="stat"><b style="font-size:22px">${esc(v)}</b><small>${l}</small></div>`).join("");
  $("#abs-meta").textContent = `${D.abs.freq}. ${D.abs.duration}.`;
  $("#moves").innerHTML = D.abs.moves.map(m => `<div class="move"><div><b>${esc(m.name)}</b><ul>${m.cues.map(c => `<li>${esc(c)}</li>`).join("")}</ul></div><span class="dose">${esc(m.dose)}</span></div>`).join("");
  $("#abs-goals").textContent = "Objectif : " + D.abs.goals.join(", ").toLowerCase() + ".";
  $("#recipes").innerHTML = D.recipes.map(r => `<article class="panel recipe"><h3>${esc(r.name)}</h3><div class="muted" style="font-size:14px">${esc(r.yield)}</div>
    <div class="macro"><span>${esc(r.kcal)}</span><span>${esc(r.protein)} protéines</span></div>
    <ul>${r.ingredients.map(i => `<li>${esc(i)}</li>`).join("")}</ul>
    ${r.detail.length ? `<details><summary class="muted" style="cursor:pointer">Détail des calories</summary><ul>${r.detail.map(i => `<li>${esc(i)}</li>`).join("")}</ul></details>` : ""}</article>`).join("");
})();
</script>
</body>
</html>
